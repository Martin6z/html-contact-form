
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact form for questions, feedback, and general inquiries.">
    <title>Contact Form | DevJournal</title>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <p>Have a question or suggestion? Send us a message.</p>
    </header>

    <main>
        <form action="https://example.com/contact" method="post">
            <div>
                <label for="full-name">Full Name:</label>
                <input
                    type="text"
                    id="full-name"
                    name="fullName"
                    autocomplete="name"
                    required
                >
            </div>

            <div>
                <label for="email">Email Address:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >
            </div>

            <div>
                <label for="subject">Subject:</label>
                <select id="subject" name="subject" required>
                    <option value="">Select a subject</option>
                    <option value="general-inquiry">General Inquiry</option>
                    <option value="technical-support">Technical Support</option>
                    <option value="feedback">Feedback</option>
                    <option value="partnership">Partnership</option>
                </select>
            </div>

            <div>
                <label for="message">Message:</label>
                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    minlength="10"
                    required
                ></textarea>
            </div>

            <fieldset>
                <legend>How did you hear about us?</legend>

                <div>
                    <input
                        type="radio"
                        id="source-search"
                        name="referralSource"
                        value="search-engine"
                        required
                    >
                    <label for="source-search">Search engine</label>
                </div>

                <div>
                    <input
                        type="radio"
                        id="source-social"
                        name="referralSource"
                        value="social-media"
                    >
                    <label for="source-social">Social media</label>
                </div>

                <div>
                    <input
                        type="radio"
                        id="source-friend"
                        name="referralSource"
                        value="friend"
                    >
                    <label for="source-friend">Friend or colleague</label>
                </div>

                <div>
                    <input
                        type="radio"
                        id="source-other"
                        name="referralSource"
                        value="other"
                    >
                    <label for="source-other">Other</label>
                </div>
            </fieldset>

            <div>
                <input
                    type="checkbox"
                    id="newsletter"
                    name="newsletter"
                    value="yes"
                >
                <label for="newsletter">
                    Subscribe to our newsletter
                </label>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 DevJournal. All rights reserved.</p>
    </footer>
</body>
</html>
